project:
  name: AI Multimodal Teaching Copilot
  version: 1.0.0

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  chunk_duration: 5

speech:
  whisper_model: base
  language: en

ppt:
  output_directory: outputs/ppt

images:
  output_directory: outputs/images

logging:
  level: INFO

llm:
  provider: groq
  model: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  timeout: 30
  max_retries: 2
  temperature: 0.2
  max_tokens: 2048
  reasoning_effort: medium