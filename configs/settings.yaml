project:
  name: AI Multimodal Teaching Copilot
  version: 1.0.0

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  chunk_duration: 5

speech:
  whisper_model: base
  language: en

ppt:
  output_directory: outputs/ppt

images:
  output_directory: outputs/images

logging:
  level: INFO

llm:
  provider: groq
  model: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  timeout: 30
  max_retries: 2
  temperature: 0.2
  max_tokens: 2048
  reasoning_effort: medium

lsi:
  reasoner_enabled: true
  reasoner_reasoning_effort: low
  reasoner_max_tokens: 320
  continue_threshold: 0.45
  related_floor: 0.30
  return_floor: 0.55
  top_k_candidates: 5
  max_nodes: 200

semantic:
  enabled: true
  reasoner_model: openai/gpt-oss-120b
  fallback_model: openai/gpt-oss-20b
  reasoner_reasoning_effort: low
  reasoner_max_tokens: 1600
  queue_max_size: 64
  batch_size: 2
  batch_timeout: 6.0
  max_calls_per_minute: 2
  min_interval_seconds: 20.0