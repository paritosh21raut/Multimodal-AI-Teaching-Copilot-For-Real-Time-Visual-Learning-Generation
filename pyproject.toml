[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.0.1"
description = "Multimodal AI Teaching Copilot for Real-Time Visual Learning Generation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6",
    "tomli>=2.0; python_version < '3.11'",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Added per milestone so the base install stays light.
# Silero VAD ships inside faster-whisper (ONNX); CUDA 12 runtime libs come from NVIDIA wheels on Windows.
audio = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.2",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
# pypdfium2: the teacher's PDF notes in /control (F-009), rendered and read locally
display = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pypdfium2>=4"]
understanding = ["httpx>=0.27", "numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.20"]
# V1b images: CLIP ViT-B/32 (ONNX int8, CPU) re-ranking + Pillow decoding; the model downloads to models/clip
images = ["pillow>=10", "httpx>=0.27", "numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12", "playwright>=1.44"]

[project.scripts]
copilot = "copilot.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_llm: calls real LLM providers (opt-in)",
    "browser: drives a real browser (opt-in)",
    "slow: long-running tests",
]
addopts = "-m 'not live_llm and not browser and not slow'"
