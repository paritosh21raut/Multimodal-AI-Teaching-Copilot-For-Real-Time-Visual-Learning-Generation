[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.0.1"
description = "Multimodal AI Teaching Copilot for Real-Time Visual Learning Generation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6",
    "tomli>=2.0; python_version < '3.11'",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Added per milestone so the base install stays light.
audio = ["sounddevice>=0.4", "numpy>=1.24", "faster-whisper>=1.0", "silero-vad>=5.1"]
display = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
understanding = ["httpx>=0.27", "sentence-transformers>=2.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
copilot = "copilot.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_llm: calls real LLM providers (opt-in)",
    "browser: drives a real browser (opt-in)",
    "slow: long-running tests",
]
addopts = "-m 'not live_llm and not browser and not slow'"
