<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom Display</title>
  <link rel="stylesheet" href="/web/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="/web/shared/tokens.css" />
  <link rel="stylesheet" href="/web/shared/slide.css" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { cursor: none; }
    #root, .viewport { position: fixed; inset: 0; }
    .stage { position: absolute; left: 50%; top: 50%; transform-origin: center center; }
    /* a page of the teacher's notes on the projector (F-010b) */
    .notes-shown { position: fixed; inset: 0; z-index: 5; background: var(--bg); animation: notes-in 220ms ease both; }
    /* the whole page fits the screen, centred (a grid cell would let a tall page overflow) */
    .notes-shown img { position: absolute; inset: 0; margin: auto; max-width: 96%; max-height: 96%; background: #fff;
      border-radius: 6px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28); }
    @keyframes notes-in { from { opacity: 0; } }
    /* students: thin scroll bars (F-010b #13) */
    * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent) transparent; }
    /* students' page only (F-010): the PDFs the teacher shares */
    .shared-files { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: grid; justify-items: end; gap: 8px;
      font: 600 14px var(--font-text); max-width: calc(100vw - 32px); }
    .shared-files > button { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); background: color-mix(in srgb, var(--surface) 88%, transparent);
      color: var(--ink); font: inherit; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 8px 26px rgba(0, 0, 0, 0.18); opacity: 0.9; }
    .shared-files > button:hover, .shared-files.open > button { opacity: 1; }
    .shared-files svg { width: 18px; height: 18px; color: var(--accent); }
    .shared-files em { font-style: normal; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
    .shared-list { display: grid; gap: 2px; padding: 6px; border-radius: 14px; background: var(--surface); width: min(420px, calc(100vw - 32px));
      border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25); }
    .shared-list a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; }
    .shared-list a:hover { background: var(--surface-2); }
    .shared-list span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shared-list b { flex: none; font-size: 12px; color: var(--accent); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/web/display/app.js"></script>
</body>
</html>
