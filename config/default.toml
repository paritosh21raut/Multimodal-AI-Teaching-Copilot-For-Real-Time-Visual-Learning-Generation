# Defaults. Override with config/local.toml (git-ignored) or env COPILOT__SECTION__KEY.

[app]
data_dir = "data"
min_free_gb = 1.0          # F-013 S4: warn at start when the data folder's disk has less free
log_level = "INFO"
theme = "light"            # light | dark

[setup]
subject = ""
grade_level = ""
expected_topic = ""
output_language = "en"

[display]
host = "127.0.0.1"         # 0.0.0.0 to allow other devices on the LAN
port = 8765
demo_interval_s = 3.0
# Share with students (F-008): a Cloudflare quick tunnel to /view, no account. cloudflared is looked up here, then on
# PATH, then in data/bin (downloaded there on the first share from this URL).
cloudflared = ""
cloudflared_url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
share_start_timeout_s = 45.0

[presentation]
min_dwell_s = 10.0         # an automatic slide change waits until the live slide was up this long (lecture time; F-013: 15 -> 10; an announced topic never waits)
part_dwell_s = 6.0         # ... but only this long before the next part of the same (full) frame
provisional = true         # fast path: keyword teaser on the live slide until the interpretation arrives
provisional_ttl_s = 20.0
title_slide = true         # title slide at LIVE when an expected topic is given
simulations = "auto"       # F-014: auto (a spoken cue shows one) | suggest (a /control chip) | off; the teacher's switch wins (data/preferences.json)

[images]
enabled = true             # automatic images (F-007b); the teacher's own images work either way
cache_dir = "data/cache/images"
clip_dir = "models/clip"
budget_s = 8.0             # whole search (sources + downloads + CLIP); after that: no image
min_similarity = 0.22      # CLIP int8 cosine floor (labelled set, F-007b)
min_margin = 0.01          # over the best generic distractor ("a logo", "a map", ...)
openverse = false          # user 2026-10-06: only if it proves educational
web_pages = true           # F-013 S4: figures from educational web pages (diagrams + figures the teacher asks for)
article_images = true      # F-013 S4: the images inside the best Wikipedia article, not only its lead image
diagram_budget_s = 12.0    # F-013 S4: a diagram search (web pages take 2-5 s)
asked_budget_s = 15.0      # F-013 S4: "let's look at the block diagram of ..."
upload_max_mb = 10

[bus]
default_queue_size = 1000

[persistence]
flush_interval_s = 0.5
flush_batch = 200

[audio]
device = ""                # "" = system default input; or a device index/name
start_threshold = 0.5
end_threshold = 0.35
min_silence_ms = 600
pad_ms = 200
min_speech_ms = 300
max_utterance_s = 15.0

[stt]
model = "medium.en"        # small.en for low-resource machines (see F-002 measurements)
device = "cuda"            # cuda | cpu
compute_type = "int8_float16"   # use "int8" on cpu
beam_size = 1
download_root = "models/whisper"
partial_model = "distil-small.en"   # F-013 S1b: live text while the teacher speaks ("" = off); final text stays on `model`
partial_interval_s = 0.8            # a pass over the utterance in progress this often (latest audio only, never queued)

[sim]
words_per_minute = 150
min_utterance_s = 1.0
speed = 1.0

[understanding]
embed_repo = "sentence-transformers/all-MiniLM-L6-v2"
embed_dir = "models/minilm"
shift_threshold = 0.75     # smoothed 1-cos vs concept centroid; calibrated on fixtures (F-004)
concept_alpha = 0.35       # EMA weight of a new utterance in the concept centroid
topic_alpha = 0.1
pause_s = 0.6              # gate: VAD silence after a sentence end ... (F-013 S1b: 1.2 -> 0.6); the [performance] mode sets it in the app
pause_min_words = 6        # ... with at least this many buffered words
long_pause_s = 3.0         # ... or any complete unit after a long silence
max_words = 32             # gate: buffered words (F-013: 40 -> 32, replay of tests 1-30)
max_wait_s = 8.0           # gate: oldest pending content age (lecture time; F-013: 12 -> 8)
min_unit_words = 6         # gate: max_wait holds a smaller or unfinished unit for its continuation ...
hold_s = 4.0               # ... for at most this long past max_wait (F-013: 6 -> 4)
buffer_cap_tokens = 600    # max transcript tokens per interpretation call
min_call_interval_s = 2.0  # wall clock (S1b: 4 -> 2) (F-013: 8 -> 4); the [performance] mode sets it in the app
interpret_deadline_s = 15.0
prompt_budget_tokens = 3000   # whole prompt (static system part + dynamic part)
dynamic_budget_tokens = 1200  # header + outline + summary + new lines
max_output_tokens = 1400
min_concern_confidence = 0.6
min_transcription_confidence = 0.3   # concerns of kind "transcription" (suspected mis-hearing)

# F-013 (user 2026-10-17): the teacher's switch in /control (the last choice is kept in data/preferences.json; this is
# the first default). standard = the S1 settings, fewer LLM calls; high = the S1b settings, every finished sentence
# goes to the LLM (same WAV: 16-17 calls vs 11). Both keep the instant display of the live speech model (0 tokens).
[performance]
mode = "standard"

[performance.standard]
pause_s = 1.2
min_call_interval_s = 4.0
split_sentences = false

[performance.high]
pause_s = 0.6
min_call_interval_s = 2.0
split_sentences = true

[llm]
timeout_s = 6.0
retries = 1
cooldown_429_s = 20.0
cooldown_unavailable_s = 60.0
cooldown_rejected_s = 300.0
usage_file = "data/llm_usage.json"   # daily tokens per key + model (git-ignored); shown at startup
# Groq first: every key in .env is used (GROQ_API_KEY, GROQ_API_KEY_2, ... _9), the same model through the next key
# when one key's daily quota is spent. OpenRouter was removed (user 2026-10-06: its free model answered 404). Ollama
# is NOT in the default order: with Whisper on the 4 GB GPU it produced no valid output and once copied the prompt's
# example values (verify round 6); when every model fails, the deterministic fallback shows the spoken content. Opt
# in via config/local.toml only.
order = ["groq_main", "groq_alt"]

[llm.providers.groq_main]
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
rpm = 30
tpm = 8000
tpd = 200000   # Groq free tier, per model and key
extra = { reasoning_effort = "low", include_reasoning = false }

[llm.providers.groq_alt]
base_url = "https://api.groq.com/openai/v1"
model = "qwen/qwen3.8-27b"
api_key_env = "GROQ_API_KEY"
rpm = 30
tpm = 8000
tpd = 200000
max_output_tokens = 900    # Groq limits this model to 1000 output tokens/min; typical outputs are 300-600

[llm.providers.ollama]
base_url = "http://localhost:11434/v1"
model = "qwen2.5:3b"
rpm = 60
tpm = 100000
